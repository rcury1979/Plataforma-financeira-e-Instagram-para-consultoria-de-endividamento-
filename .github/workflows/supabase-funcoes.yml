# Publica automaticamente as funções do servidor (Supabase Edge Functions) a cada mudança em supabase/functions.
# Precisa de UM segredo no GitHub (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  → gerado em https://supabase.com/dashboard/account/tokens
name: Publicar funções do Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml", ".github/workflows/supabase-funcoes.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fhgecznujymzmzopnpyd
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar todas as funções
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings → Secrets → Actions)."
            exit 1
          fi
          # remove espaços/quebras de linha que às vezes vêm junto ao colar o token
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')"
          case "$SUPABASE_ACCESS_TOKEN" in sbp_*) ;; *) echo "::error::O segredo SUPABASE_ACCESS_TOKEN não começa com sbp_ (foi colado outro texto)."; exit 1;; esac
          falhas=""
          for d in supabase/functions/*/; do
            f=$(basename "$d")
            [ "$f" = "_shared" ] && continue
            [ -f "$d/index.ts" ] || continue
            echo "→ $f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api || falhas="$falhas $f"
          done
          if [ -n "$falhas" ]; then echo "::error::Falharam:$falhas"; exit 1; fi
